<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- TuniVerse logo: Arced T-bar with upward arrow — ambition meets horizon -->
  <!-- Background square with rounded corners (red brand background) -->
  <rect width="100" height="100" rx="22" fill="#e11d48"/>
  <!-- Arced T crossbar (white) -->
  <path d="M18 52 Q50 38 82 52" stroke="white" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Vertical bar of T (white) -->
  <rect x="44.5" y="48" width="11" height="28" rx="3" fill="white"/>
  <!-- Upward arrow head (white) -->
  <polygon points="50,18 41,38 59,38" fill="white"/>
</svg>
